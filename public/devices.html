<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Management - KELALBINGO Admin</title>
    <link rel="stylesheet" href="css/common.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Device Management</h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="addDeviceBtn">Add Device</button>
                <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Back to
                    Dashboard</button>
            </div>
        </div>

        <div class="content">
            <!-- Add Device Form -->
            <div class="card" id="addDeviceCard" style="display: none;">
                <h3>Add Authorized Device</h3>
                <form id="addDeviceForm">
                    <div class="form-group">
                        <label for="deviceSerial">Device Serial Number:</label>
                        <input type="text" id="deviceSerial" required placeholder="Enter device serial number">
                    </div>
                    <div class="form-group">
                        <label for="deviceName">Device Name:</label>
                        <input type="text" id="deviceName" placeholder="Optional device name">
                    </div>
                    <div class="form-group">
                        <label for="licenseType">License Type:</label>
                        <select id="licenseType">
                            <option value="standard">Standard</option>
                            <option value="premium">Premium</option>
                            <option value="trial">Trial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expiresAt">Expires At (Optional):</label>
                        <input type="datetime-local" id="expiresAt">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Add Device</button>
                        <button type="button" class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Devices List -->
            <div class="card">
                <h3>Authorized Devices</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Serial Number</th>
                                <th>Device Name</th>
                                <th>License Type</th>
                                <th>Status</th>
                                <th>Last Access</th>
                                <th>Access Count</th>
                                <th>Expires</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="devicesTableBody">
                            <tr>
                                <td colspan="8" class="loading">Loading devices...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Device Access Logs -->
            <div class="card">
                <h3>Recent Access Attempts</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Device Serial</th>
                                <th>Success</th>
                                <th>Message</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="accessLogsTableBody">
                            <tr>
                                <td colspan="4" class="loading">Loading access logs...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            loadDevices();
            loadAccessLogs();
        });

        // Add device form toggle
        document.getElementById('addDeviceBtn').addEventListener('click', () => {
            const card = document.getElementById('addDeviceCard');
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('cancelAddBtn').addEventListener('click', () => {
            document.getElementById('addDeviceCard').style.display = 'none';
            document.getElementById('addDeviceForm').reset();
        });

        // Add device form submission
        document.getElementById('addDeviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                deviceSerial: document.getElementById('deviceSerial').value,
                deviceName: document.getElementById('deviceName').value,
                licenseType: document.getElementById('licenseType').value,
                expiresAt: document.getElementById('expiresAt').value || null
            };

            try {
                const response = await apiRequest('/api/add-device', 'POST', formData);

                if (response.success) {
                    showNotification('Device added successfully', 'success');
                    document.getElementById('addDeviceCard').style.display = 'none';
                    document.getElementById('addDeviceForm').reset();
                    loadDevices();
                } else {
                    showNotification(response.message || 'Failed to add device', 'error');
                }
            } catch (error) {
                showNotification('Error adding device', 'error');
            }
        });

        // Load devices
        async function loadDevices() {
            try {
                const response = await apiRequest('/api/devices');

                if (response.success) {
                    displayDevices(response.devices);
                } else {
                    showNotification('Failed to load devices', 'error');
                }
            } catch (error) {
                showNotification('Error loading devices', 'error');
            }
        }

        // Display devices in table
        function displayDevices(devices) {
            const tbody = document.getElementById('devicesTableBody');

            if (devices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">No authorized devices found</td></tr>';
                return;
            }

            tbody.innerHTML = devices.map(device => `
                <tr>
                    <td><code>${device.device_serial}</code></td>
                    <td>${device.device_name || 'Unknown'}</td>
                    <td><span class="badge badge-${device.license_type}">${device.license_type}</span></td>
                    <td><span class="status ${device.is_active ? 'active' : 'inactive'}">${device.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>${device.last_access ? formatDate(device.last_access) : 'Never'}</td>
                    <td>${device.access_count || 0}</td>
                    <td>${device.expires_at ? formatDate(device.expires_at) : 'Never'}</td>
                    <td>
                        ${device.is_active ?
                    `<button class="btn btn-sm btn-danger" onclick="removeDevice('${device.device_serial}')">Remove</button>` :
                    `<span class="text-muted">Removed</span>`
                }
                    </td>
                </tr>
            `).join('');
        }

        // Remove device
        async function removeDevice(serial) {
            if (!confirm(`Are you sure you want to remove device ${serial}?`)) {
                return;
            }

            try {
                const response = await apiRequest(`/api/remove-device/${serial}`, 'DELETE');

                if (response.success) {
                    showNotification('Device removed successfully', 'success');
                    loadDevices();
                } else {
                    showNotification(response.message || 'Failed to remove device', 'error');
                }
            } catch (error) {
                showNotification('Error removing device', 'error');
            }
        }

        // Load access logs (simplified for now)
        async function loadAccessLogs() {
            const tbody = document.getElementById('accessLogsTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="no-data">Access logs feature coming soon</td></tr>';
        }

        // Utility functions
        function formatDate(dateString) {
            return new Date(dateString).toLocaleString();
        }

        function showNotification(message, type) {
            // Simple notification - you can enhance this
            alert(message);
        }
    </script>

    <style>
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-standard {
            background: #007bff;
            color: white;
        }

        .badge-premium {
            background: #28a745;
            color: white;
        }

        .badge-trial {
            background: #ffc107;
            color: black;
        }

        .status.active {
            color: #28a745;
        }

        .status.inactive {
            color: #dc3545;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-actions {
            margin-top: 20px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        code {
            background: #f8f9fa;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</body>

</html>
